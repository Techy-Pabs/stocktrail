target-version = "py313"
line-length = 120

[lint]
# E/W: style errors, F: real mistakes (unused imports, undefined names),
# I: import order, B: common bugs, UP: modern Python syntax
select = ["E", "W", "F", "I", "B", "UP"]
# B008 flags Depends(...) in default arguments, which is how FastAPI works
ignore = ["B008"]

[lint.isort]
known-first-party = ["app"]
# The alembic/ folder (our migrations) would otherwise make ruff treat the
# alembic library as our own code
known-third-party = ["alembic"]
