# Alembic configuration. Migrations live in alembic/versions.

[alembic]
script_location = %(here)s/alembic
# Lets alembic/env.py import the "app" package from the project root
prepend_sys_path = .
path_separator = os

# The database URL is not set here. alembic/env.py reads it from
# DATABASE_URL via app.core.config, so no credentials live in this file.
# sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
